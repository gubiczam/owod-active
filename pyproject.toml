[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owl"
version = "0.1.0"
description = "Distribution-aware active annotation for open-world incremental object detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["owl*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: executes every notebook cell with PROB and Colab faked (a few minutes)",
]
